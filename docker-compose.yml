# provenance.fm — local dev stack.  Run:  docker compose up --build
# (needs backend/Dockerfile and frontend/Dockerfile — minimal ones below in the brief)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance
      POSTGRES_DB: provenance
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: uvicorn provenance.app:app --host 0.0.0.0 --port 5050 --reload
    environment:
      DATABASE_URL: postgresql://provenance:provenance@db:5432/provenance
      REDIS_URL: redis://redis:6379/0
    ports: ["5050:5050"]
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    command: npm run dev -- --host
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
